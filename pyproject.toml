[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyprotect"
version = "2.3.1"
description = "A Pythonic client for IBM Key Protect"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Michael Darmawan", email = "Michael.Darmawan@ibm.com" },
    { name = "Prasidda Gautam", email = "p.g@ibm.com" },
    { name = "IBM Key Protect", email = "ibmkp@us.ibm.com" }
]
requires-python = ">=3.9"
dependencies = [
    "ibm-cloud-sdk-core>=3.24.0,<4.0.0",
    "python-dateutil>=2.5.3,<3.0.0",
    "requests>=2.26.0,<3.0.0",
    "urllib3>=2.0.0,<3.0.0",
]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/IBM/keyprotect-python-client"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "coverage>=4.5.4",
    "cryptography>=3.4.0",
    "pylint>=3.0.0",
    "pytest>=7.0.1",
    "pytest-cov>=2.2.1",
    "pytest-rerunfailures>=3.1",
    "responses>=0.12.1",
    "twine>=6.0.0",
]
